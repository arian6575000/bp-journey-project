name: Build BP Journey Android APK

on:
  workflow_dispatch:
  # Rebuild when you edit the app. The initial ZIP upload and the unzip
  # workflow's own commit do not match these paths, so they never trigger a
  # half-empty build; unzip.yml starts the build explicitly instead.
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "app.json"
      - "src/**"

permissions:
  contents: write

concurrency:
  group: bp-journey-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project files
        run: |
          test -f package.json || {
            echo "ERROR: package.json not found in the repository root."
            echo "Run the 'Extract ZIP in Repository Root' workflow first."
            exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BP-Journey-Android-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bp-journey-apk-${{ github.run_number }}
          name: BP Journey APK #${{ github.run_number }}
          body: |
            BP Journey Android APK.
            Download the APK from the Assets section.
          files: android/app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
