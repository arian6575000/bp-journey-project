name: Extract ZIP in Repository Root

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found in repository root."
            exit 1
          fi

          echo "Extracting $ZIP_FILE"
          # .github is excluded: GITHUB_TOKEN is not allowed to modify workflow files.
          unzip -o "$ZIP_FILE" -d . -x ".github/*" "__MACOSX/*"
          rm -f "$ZIP_FILE"

          test -f package.json || {
            echo "ERROR: package.json not found in repository root after extraction."
            echo "The ZIP must contain the project files directly (not inside a sub-folder)."
            exit 1
          }

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract ZIP into repository root"
          git push

      # Pushes made with GITHUB_TOKEN do not trigger other workflows,
      # so start the APK build explicitly.
      - name: Trigger APK build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-apk.yml --ref "${{ github.ref_name }}"
